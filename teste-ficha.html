<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>teste ficha</title>
<link rel="stylesheet" href="https://autosintese.app.br/crm.css?v=T3">
<style>
:root{--bg:#141416;--panel:#1b1b1f;--panel2:#232329;--line:#2c2c34;--cardh:#2a2a31;--txt:#ececf1;--muted:#9a9aa6;--fraco:#6e6e7a;--brand:#7b68ee;--brand2:#a78bfa;--ok:#22c07a;--danger:#ff6b7a;--warn:#f0c869;--info:#6ea8ff}
*{box-sizing:border-box}body{margin:0;background:#0d0d0f;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;color:var(--txt)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line)}
.mhead{padding:13px 16px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:16px}
.x{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;flex:none}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.btn.small{padding:6px 11px;font-size:12px}
.crm-badge{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600;background:var(--panel2);color:var(--muted)}
.crm-badge.info{background:rgba(110,168,255,.16);color:#6ea8ff}
.crm-hint{font-size:12px;color:var(--fraco);margin-top:12px}
.crm-orig .st{display:flex;gap:9px;padding:7px 0}
.crm-orig .st i{width:12px;height:12px;border-radius:50%;border:2px solid var(--brand);flex:none;margin-top:3px}
.crm-orig .k{font-size:10px;text-transform:uppercase;color:var(--fraco);letter-spacing:.5px}
.crm-orig .v{font-size:13px;font-weight:600}
</style></head><body>
<div class="overlay crm-ov" id="ov"></div>
<script>
var etapas=['Para atender','Agendamento','Follow up','Ganhou','Perdeu'];
var gente=['Bernardo Antunes','Claude (robô)','Gabriel','José','Kennedy Lima'];
var fatos=[['SDR','—'],['Closer','—'],['Primeiro contato','16 set, 21:06'],['Próxima atividade','—'],['Valor estimado','—'],['Receita','—'],['Atualizado','16 set, 21:22']];
var eventos=[['16 de set · 21:22','Mudou de estágio','Bernardo','Para atender → <strong>Ligação</strong>'],
             ['16 de set · 21:22','Mudou de estágio','Bernardo','Novo lead → <strong>Para atender</strong>'],
             ['16 de set · 21:06','Lead criado','sistema','Meta Ads']];
var bts=function(a){return a.map(function(t){return '<button class="btn secondary small">'+t+'</button>';}).join('');};
var cab='<div class="mhead crm-mh"><div class="big">FA</div>'+
  '<div class="q"><h3>FELIPE ARAUJO</h3><div class="sub">(11) 98765-0002 · ciclo #1</div></div>'+
  '<span class="crm-badge info">Ligação</span><button class="x">&times;</button></div>';
var acoes='<div class="crm-acoes"><div class="lb">Mover etapa</div><div class="bts">'+bts(etapas)+'</div>'+
  '<div class="lb">Atribuir</div><div class="bts">'+bts(gente)+'</div></div>';
var esq='<div class="crm-facts">'+fatos.map(function(f){return '<div class="crm-fact"><div class="k">'+f[0]+'</div><div class="v">'+f[1]+'</div></div>';}).join('')+'</div>'+
  '<div class="crm-box"><h4>Observações</h4><div style="font-size:13px">[TESTE] apagar depois</div></div>'+
  '<div class="crm-box"><h4>Linha do tempo <span style="color:var(--fraco);font-weight:500;font-size:12px">quem fez, quando</span></h4><div class="crm-tl">'+
  eventos.map(function(e){return '<div class="e"><div class="h">'+e[0]+'</div><i class="ev">→</i><div><b>'+e[1]+'</b> <span class="who">· '+e[2]+'</span><div>'+e[3]+'</div></div></div>';}).join('')+'</div></div>';
var dir='<div class="crm-box"><h4>Origem do lead <button class="btn secondary small">IDs</button></h4><div class="crm-orig">'+
  '<div class="st"><i></i><div><div class="k">Canal</div><div class="v">Meta Ads</div></div></div>'+
  '<div class="st"><i></i><div><div class="k">Detalhe</div><div class="v">sem campanha vinculada</div></div></div></div></div>'+
  '<div class="crm-box"><h4>Agendamento <button class="btn secondary small">agendar</button></h4><div class="crm-hint" style="margin:0">Nenhuma sessão marcada.</div></div>'+
  '<div class="crm-box"><h4>Contato</h4><div class="crm-mini"><div><span>Ciclos comerciais</span><b>1</b></div><div><span>Desde</span><b>16 de set</b></div></div></div>';
var ficha='<div class="crm-ficha"><div>'+esq+'</div><div>'+dir+'</div></div>';
var rod='<div class="crm-rod"><button class="btn secondary">📅 Agendar</button><button class="btn ganho">🎉 Ganho</button><button class="btn secondary crm-mais">···</button></div>';
document.getElementById('ov').innerHTML='<div class="modal">'+cab+acoes+ficha+rod+'</div>';
</script></body></html>
