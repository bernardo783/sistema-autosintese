function Video({d}){
  const [on,setOn]=React.useState(false); const ref=React.useRef();
  React.useEffect(()=>{if(on&&ref.current){ref.current.play();}},[on]);
  return <div className="video" style={{cursor:'pointer'}} onClick={()=>!on&&setOn(true)}>
    {on ? <video ref={ref} src={d.video} poster={d.poster} controls playsInline style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}}/> :
    <><img src={d.poster} alt="" style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',filter:'brightness(.7)'}}/><div className="play" style={{position:'relative'}}><I n="play" s={24}/></div></>}
  </div>;
}
function Form({compact}){
  const [ok,setOk]=React.useState(false);
  const [fone,setFone]=React.useState('');
  const [insta,setInsta]=React.useState('');
  // quem digita com +55 na frente: tira o 55 em vez de cortar o fim do numero
  const mask=v=>{let d=v.replace(/\D/g,'');if(d.length>11&&d.startsWith('55'))d=d.slice(2);d=d.slice(0,11);if(d.length<=2)return d.length?'('+d:'';if(d.length<=6)return '('+d.slice(0,2)+') '+d.slice(2);if(d.length<=10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);};
  const handle=v=>{const s=v.replace(/\s|@/g,'').replace(/[^a-zA-Z0-9._]/g,'').slice(0,30);return s?'@'+s:'';};
  const [enviando,setEnviando]=React.useState(false);
  const [erro,setErro]=React.useState('');
  // envia pro sistema (edge function lead-ads -> tabela ads_leads); a tela "Recebido" so aparece depois de gravar
  const enviar=async e=>{e.preventDefault();if(fone.replace(/\D/g,'').length<10)return;if(enviando)return;
    const fd=new FormData(e.target); const q=new URLSearchParams(location.search); const utm={};
    ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid'].forEach(k=>{if(q.get(k))utm[k]=q.get(k);});
    setEnviando(true);setErro('');
    try{
      const r=await fetch('https://fuieonexmdupupcsyowg.supabase.co/functions/v1/lead-ads',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({nome:fd.get('nome'),whatsapp:fone,instagram:insta,cargo:fd.get('cargo'),site:fd.get('site'),pagina:location.pathname,url:location.href,utm,
          fbp:(document.cookie.match(/(?:^|; )_fbp=([^;]+)/)||[])[1]||'', fbc:(document.cookie.match(/(?:^|; )_fbc=([^;]+)/)||[])[1]||''})});
      const j=await r.json().catch(()=>({}));
      if(r.ok&&j.ok){
        // thank-you page: URL propria pra Meta e Google rastrearem a conversao. O Lead dispara la,
        // uma vez so; a marca no sessionStorage evita contar de novo se a pessoa recarregar.
        try{sessionStorage.setItem('as_lead',String(j.id||Date.now()));}catch(_){}
        setOk(true); location.assign('obrigado/'); }
      else setErro('Não deu pra enviar. Confere o WhatsApp e tenta de novo.');
    }catch(_){setErro('Sem conexão. Tenta de novo em instantes.');}
    setEnviando(false);};
  if(ok) return <Card kicker="Recebido" title="Recebemos seus dados.">Entraremos em contato pelo WhatsApp.</Card>;
  return <form onSubmit={enviar} style={{background:'#0F0D14',border:'1px solid rgba(255,255,255,.12)',borderRadius:22,padding:28,display:'flex',flexDirection:'column',gap:14,boxShadow:'0 40px 100px -30px rgba(0,0,0,.9)'}}>
    <div><h3 style={{fontSize:20,marginBottom:4}}>Preencha o formulário!</h3><span style={{fontSize:13,color:'var(--muted)'}}>Entraremos em contato.</span></div>
    <Input label="Seu nome" name="nome" placeholder="Seu nome completo" autoComplete="name" required/>
    <Input label="WhatsApp (com DDD)" name="whatsapp" type="tel" inputMode="numeric" placeholder="(11) 99999-9999" maxLength={15} value={fone} onChange={e=>setFone(mask(e.target.value))} autoComplete="tel" required/>
    <Input label="Instagram da loja" name="instagram" placeholder="@sualoja" value={insta} onChange={e=>setInsta(handle(e.target.value))} autoCapitalize="none" required/>
    <label style={{display:'flex',flexDirection:'column',gap:8}}><span style={{fontSize:13,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--txt)'}}>Qual o seu cargo na loja?</span><select className="sel" name="cargo" required defaultValue=""><option value="" disabled>Selecionar</option><option>Proprietário</option><option>Gerente</option><option>Vendedor</option><option>Marketing</option></select></label>
    <input type="text" name="site" tabIndex={-1} autoComplete="off" style={{position:'absolute',left:-9999,opacity:0,height:0}} aria-hidden="true"/>
    {erro&&<span style={{fontSize:13,color:'#f87171'}}>{erro}</span>}
    <Button type="submit" size="lg" className="pulse" disabled={enviando} style={{justifyContent:'center',opacity:enviando?.7:1}}>{enviando?'ENVIANDO…':<>QUERO ACELERAR <I n="arrow-right" s={18}/></>}</Button>
    <span style={{fontSize:12,color:'var(--muted)',textAlign:'center'}}>Seus dados servem só pra entrarmos em contato.</span>
  </form>;
}

<script>
(async()=>{
  const rel='./';
  let NS=window.AutoSintese||window.Autosintese||window.autosintese;
  if(!NS){ NS={};
    for(const n of ['Button','Tag','Card','Input','Nav']){
      let src=await (await fetch(rel+'components/core/'+n+'.jsx?v='+Date.now())).text();
      src=src.split('\n').filter(l=>!/^\s*import\s/.test(l)).join('\n').replace(/export function/g,'function'); if(n==='Nav') src='const {Button}=NS;\n'+src;
      const code=Babel.transform('function __m(React,NS){'+src+'\nreturn '+n+';}',{presets:[['react',{runtime:'classic'}]]}).code;
      NS[n]=new Function(code+'\nreturn __m;')()(React,NS);
    }
    window.AutoSintese=NS;
  }
  const app=Babel.transform(document.getElementById('app-src').textContent,{presets:[['react',{runtime:'classic'}]]}).code;
  try{ new Function('React','ReactDOM','NS',app)(React,ReactDOM,NS); }
  catch(e){ console.error('app', e); document.getElementById('root').textContent=String(e); }
})().catch(e=>{console.error('load',e);document.getElementById('root').textContent=String(e);});
</script>
