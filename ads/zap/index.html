<script>
(function(){
  var WHATS='5535984034438';
  var TXT='Olá! Vim pela página da AutoSíntese e quero acelerar as vendas da minha loja.';
  var padrao='https://wa.me/'+WHATS+'?text='+encodeURIComponent(TXT);
  var destino=padrao;
  try{
    var u=new URLSearchParams(location.search).get('u');
    if(u){ var d=decodeURIComponent(u); if(/^https:\/\/(wa\.me|api\.whatsapp\.com)\//.test(d)) destino=d; }
  }catch(_){ }
  var a=document.getElementById('zap');
  if(a) a.setAttribute('href',destino);
  setTimeout(function(){ try{ location.replace(destino); }catch(_){ location.href=destino; } },2000);
})();
</script>
