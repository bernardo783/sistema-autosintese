<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Autosíntese</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<meta name="theme-color" content="#7c3aed">
<style>
  :root{
    --bg:#1a0842; --panel:#241150; --panel2:#2f1a5f; --line:#432a7d;
    --txt:#efeafc; --muted:#a394c8; --brand:#7c3aed; --brand2:#a855f7;
    --danger:#f0616b; --ok:#4ad991; --warn:#e6b13f; --shadow:0 12px 34px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  .hidden{display:none!important}

  /* ---------- LOGIN ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(120deg,#1c0947 0%,#3a1290 55%,#5322c4 100%)}
  .login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:36px 32px;box-shadow:var(--shadow)}
  .logo{display:flex;align-items:center;gap:13px;margin-bottom:6px}
  .logo .mark{width:46px;height:46px;flex:none}
  .logo .mark svg{width:100%;height:100%;display:block}
  .wordmark{line-height:1;display:inline-block;position:relative;padding-bottom:17px}
  .wordmark .wm{display:block;font-family:Arial,sans-serif;font-size:30px;font-weight:900;letter-spacing:2px;color:#fff;margin-right:-2px}
  .wordmark .wm .thin{font-weight:300}
  /* tagline presa às duas bordas do nome (camada absoluta + justificação): mesmo início, mesmo fim.
     Classe própria (.slogan) para NUNCA herdar o padding das etiquetas .tag do sistema. */
  .wordmark .slogan{position:absolute;left:0;right:0;bottom:0;margin:0;padding:0;background:none;border:none;
    text-align:justify;text-align-last:justify;-moz-text-align-last:justify;
    font-family:Arial,sans-serif;font-size:9.7px;font-weight:400;color:rgba(255,255,255,.55);
    letter-spacing:1.6px;text-transform:uppercase}
  .wordmark .slogan b{color:#fff;font-weight:900}
  .login-card h2{font-size:16px;margin:22px 0 4px}
  .login-card p.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);border-radius:10px;padding:11px 12px;font-size:14px;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
  .btn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;
    border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px;width:100%}
  .btn.secondary{background:var(--panel2);color:var(--txt);border:1px solid var(--line);font-weight:600}
  .btn.small{width:auto;padding:8px 14px;font-size:13px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);width:auto;padding:8px 12px}
  .btn.danger{background:var(--danger);color:#fff}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
  .hint{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.5}

  /* ---------- APP LAYOUT ---------- */
  #app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  .sidebar{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column}
  .sidebar .logo{margin-bottom:26px;padding:0 6px}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav button{display:flex;align-items:center;gap:11px;background:transparent;border:none;color:var(--muted);
    padding:11px 12px;border-radius:10px;font-size:14px;text-align:left;font-weight:600}
  .nav button .ic{width:20px;text-align:center;font-size:16px}
  .nav button:hover{background:var(--panel2);color:var(--txt)}
  .nav button.active{background:linear-gradient(135deg,rgba(34,184,166,.18),rgba(47,124,246,.18));
    color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
  .sidebar .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:16px}
  .main{padding:28px 34px;overflow:auto;max-height:100vh}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
  .page-head h2{font-size:22px}
  .page-head .desc{color:var(--muted);font-size:13px;margin-top:3px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .search{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:9px 12px;font-size:13.5px;min-width:200px;outline:none}
  .search:focus{border-color:var(--brand)}

  /* cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .card .k{color:var(--muted);font-size:12.5px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  .card .v{font-size:24px;font-weight:800}
  .v.pos{color:var(--ok)} .v.neg{color:var(--danger)}

  /* table */
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:13px 16px;font-size:13.5px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;background:var(--panel2)}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}
  .tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
  .tag.receita{background:rgba(62,196,109,.15);color:var(--ok)}
  .tag.despesa{background:rgba(229,72,77,.15);color:var(--danger)}
  .tag.st{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .tag.andamento{background:rgba(47,124,246,.15);color:#7db0ff}
  .tag.concluido{background:rgba(62,196,109,.15);color:var(--ok)}
  .tag.pausado{background:rgba(224,166,59,.15);color:var(--warn)}
  .tag.planejado{background:rgba(139,152,172,.15);color:var(--muted)}
  .tag.novo{background:rgba(47,124,246,.15);color:#7db0ff}
  .tag.onboarding{background:rgba(224,166,59,.15);color:var(--warn)}
  .tag.ativo{background:rgba(62,196,109,.15);color:var(--ok)}
  .tag.churn{background:rgba(229,72,77,.15);color:var(--danger)}
  .tag.cat-trafego{background:rgba(47,124,246,.18);color:#7db0ff}
  .tag.cat-ia{background:rgba(45,212,191,.15);color:#2dd4bf}
  .tag.cat-full{background:rgba(245,158,11,.18);color:#fbbf24}
  .avt{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-size:11px;font-weight:800;color:#fff;border:2px solid var(--panel);flex:none;letter-spacing:.5px}
  .avts{display:inline-flex;align-items:center}
  .avts .avt+.avt{margin-left:-9px}
  .tag.cat-outro{background:var(--panel2);color:var(--muted)}
  .stSel{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;font-weight:700;cursor:pointer;outline:none}
  .stSel.recebido{background:rgba(62,196,109,.15);color:var(--ok);border-color:rgba(62,196,109,.4)}
  .stSel.inadimplente{background:rgba(229,72,77,.15);color:var(--danger);border-color:rgba(229,72,77,.4)}
  .stSel.areceber{background:rgba(224,166,59,.15);color:var(--warn);border-color:rgba(224,166,59,.4)}
  .stSel.sinal{background:rgba(47,124,246,.15);color:#7db0ff;border-color:rgba(47,124,246,.4)}
  .stSel option{background:var(--panel2);color:var(--txt)}
  .rowact{display:flex;gap:6px}
  .iconbtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;
    padding:5px 9px;font-size:12.5px}
  .iconbtn:hover{color:var(--txt);border-color:var(--brand)}
  .iconbtn.del:hover{color:var(--danger);border-color:var(--danger)}
  .money{font-variant-numeric:tabular-nums;font-weight:700}
  .empty{padding:44px;text-align:center;color:var(--muted);font-size:14px}
  a.link{color:#7db0ff;text-decoration:none}
  a.link:hover{text-decoration:underline}
  .pw-cell{display:flex;align-items:center;gap:8px}
  .pw-dots{font-family:monospace;letter-spacing:2px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(4,8,16,.6);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;
    box-shadow:var(--shadow);max-height:90vh;overflow:auto}
  .modal .mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal .mhead h3{font-size:17px}
  .modal .mbody{padding:20px 22px}
  .modal .mfoot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .x{background:transparent;border:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
  .x:hover{color:var(--txt)}

  /* toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:12px 20px;border-radius:10px;
    font-size:13.5px;box-shadow:var(--shadow);transition:.25s;z-index:3000;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* bar chart */
  .barchart{display:flex;gap:14px;align-items:flex-end;height:150px;padding:10px 4px}
  .barwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
  .bar{width:100%;max-width:60px;border-radius:8px 8px 0 0;transition:.4s}
  .bar.r{background:linear-gradient(180deg,var(--ok),#2a8f50)}
  .bar.d{background:linear-gradient(180deg,var(--danger),#a5343a)}
  .barwrap .lbl{font-size:12px;color:var(--muted)}
  @media(max-width:720px){#app{grid-template-columns:1fr}.sidebar{flex-direction:row;flex-wrap:wrap;position:sticky;top:0;z-index:10}
    .nav{flex-direction:row;flex-wrap:wrap}.sidebar .foot{margin:0}.main{padding:18px}}

  /* ===== Polimento visual ===== */
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--brand)}
  #login{position:relative;overflow:hidden}
  #login::before{content:'';position:absolute;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle,rgba(168,85,247,.28),transparent 65%);top:-140px;right:-120px;pointer-events:none}
  #login::after{content:'';position:absolute;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle,rgba(129,12,210,.25),transparent 65%);bottom:-120px;left:-100px;pointer-events:none}
  .login-card{position:relative;z-index:1;background:rgba(36,17,80,.72);backdrop-filter:blur(18px);
    border:1px solid rgba(168,85,247,.35);box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03) inset}
  .sidebar{background:linear-gradient(180deg,#241150 0%,#1d0c45 100%);box-shadow:inset -1px 0 0 rgba(168,85,247,.15)}
  .sidebar .logo{padding:2px 6px 14px;margin-bottom:18px;border-bottom:1px solid rgba(168,85,247,.18)}
  .sidebar .logo .mark{filter:drop-shadow(0 0 10px rgba(168,85,247,.55))}
  .nav button{position:relative;transition:all .18s ease;border-radius:11px}
  .nav button:hover{transform:translateX(3px)}
  .nav button.active{background:linear-gradient(135deg,rgba(129,12,210,.35),rgba(168,85,247,.18));
    box-shadow:inset 0 0 0 1px rgba(168,85,247,.35),0 4px 14px rgba(0,0,0,.25);color:#fff}
  .nav button.active::before{content:'';position:absolute;left:-14px;top:20%;height:60%;width:4px;border-radius:0 4px 4px 0;
    background:linear-gradient(180deg,var(--brand),var(--brand2))}
  .card{position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;border-radius:16px}
  .card::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--brand),var(--brand2),transparent);opacity:.75}
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.4);border-color:rgba(168,85,247,.4)}
  .card .v{letter-spacing:-.5px}
  .card .sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:5px}
  .tablewrap{border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  th{background:linear-gradient(180deg,#2f1a5f,#2a165a)}
  tbody tr{transition:background .15s ease}
  tbody tr:hover{background:rgba(168,85,247,.08)}
  .btn{transition:all .18s ease;box-shadow:0 6px 18px rgba(124,58,237,.35)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(124,58,237,.5);filter:brightness(1.08)}
  .btn.ghost,.btn.secondary{box-shadow:none}
  .btn.ghost:hover{border-color:var(--brand);color:var(--txt);transform:none;filter:none}
  .iconbtn{transition:all .15s ease}
  .search,.field input,.field select,.field textarea{transition:border-color .15s ease,box-shadow .15s ease}
  .search:focus,.field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 3px rgba(124,58,237,.22)}
  .stSel{transition:all .15s ease}
  .stSel:hover{transform:scale(1.03)}
  .page-head h2{letter-spacing:-.4px;background:linear-gradient(90deg,#fff,#cbb4f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .modal{border:1px solid rgba(168,85,247,.35);box-shadow:0 30px 80px rgba(0,0,0,.6)}
  #toast{background:linear-gradient(135deg,#2f1a5f,#241150);border:1px solid rgba(168,85,247,.45)}
  .fin-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .ftab{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:700;transition:all .15s ease}
  .ftab:hover{color:var(--txt);border-color:var(--brand)}
  .ftab.active{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(124,58,237,.35)}
  .calpop{position:absolute;top:calc(100% + 8px);right:0;z-index:60;background:var(--panel);border:1px solid rgba(168,85,247,.4);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.55);padding:14px;width:272px}
  .calpop .chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .calpop .chead b{font-size:13.5px}
  .calpop .cnav{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;width:28px;height:28px;cursor:pointer}
  .calpop .cnav:hover{border-color:var(--brand)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .calgrid .dow{font-size:10px;color:var(--muted);text-align:center;padding:4px 0;font-weight:700}
  .calgrid .dia{border:none;background:transparent;color:var(--txt);font-size:12.5px;padding:7px 0;border-radius:8px;cursor:pointer;font-weight:600}
  .calgrid .dia:hover{background:rgba(168,85,247,.28)}
  .calgrid .dia.off{opacity:0;pointer-events:none}
  .calgrid .dia.sel{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
  .calgrid .dia.faixa{background:rgba(124,58,237,.35);color:#fff;border-radius:0}
  .calfoot{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
  .modal.big{max-width:760px}
  .pm-it:hover:not([disabled]){background:rgba(168,85,247,.15)!important}
  .prj-nome{cursor:pointer;transition:color .12s ease}
  .prj-nome:hover{color:#c9a4fb;text-decoration:underline}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <div class="logo" style="flex-direction:column;align-items:center;text-align:center;gap:12px;margin-bottom:16px">
      <div class="mark" style="width:58px;height:58px;filter:drop-shadow(0 0 16px rgba(168,85,247,.65))"><svg viewBox="0 0 500 621" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15.0551 215.146C5.20626 231.627 0 250.529 0 269.861C0 289.194 5.20627 308.129 15.0882 324.61C18.1058 329.617 21.5214 334.393 25.3349 338.869C33.2272 348.154 42.8107 355.881 53.3227 362.016L142.592 414.211L144.018 413.382L248.574 352.266L107.64 269.894L356.977 124.185V0.296265L53.3559 177.74C41.9485 184.406 31.6687 192.928 23.3784 203.241C20.3276 207.021 17.5753 211.034 15.0882 215.179L15.0551 215.146Z" fill="#a855f7"/><path d="M484.945 405.224C494.794 388.743 500 369.842 500 350.509C500 331.176 494.794 312.241 484.912 295.76C481.894 290.753 478.478 285.977 474.665 281.501C466.773 272.216 457.189 264.49 446.678 258.355L357.408 206.159L355.982 206.988L251.426 268.104L392.36 350.476L143.023 496.184V620.074L446.644 442.63C458.051 435.964 468.331 427.442 476.621 417.129C479.672 413.349 482.425 409.336 484.912 405.191L484.945 405.224Z" fill="#a855f7"/></svg></div>
      <div class="wordmark"><span class="wm">AUTO<span class="thin">SÍNTESE</span></span><span class="slogan">Inteligênc<b>ia</b> Unida a Resultados</span></div>
    </div>

    <div id="loginView" class="hidden">
      <h2>Entrar</h2>
      <p class="sub">Acesse com seu email e senha.</p>
      <div class="field"><label>Email</label><input type="email" id="loginUser" placeholder="voce@autosintese.com.br" autocomplete="username"></div>
      <div class="field"><label>Senha</label><input type="password" id="loginPw" placeholder="senha" autocomplete="current-password"></div>
      <button class="btn" id="btnLogin">Entrar</button>
      <div class="err" id="loginErr"></div>
      <p class="hint" style="text-align:center;margin-top:16px;font-size:13px">Não tem conta? <a href="#" id="goSignup" class="link">Criar conta</a></p>
      <p class="hint" style="text-align:center"><a href="#" id="forgotLink" class="link">Esqueci a senha</a></p>
      <p class="hint" style="text-align:center;opacity:.55;margin-top:8px">versão 3.7 · autosintese.app.br</p>
    </div>

    <div id="signupView" class="hidden">
      <h2>Criar conta</h2>
      <p class="sub">Use seu email. A conta fica aguardando aprovação de um usuário master.</p>
      <div class="field"><label>Seu nome</label><input id="suNome" placeholder="ex: Maria"></div>
      <div class="field"><label>Email</label><input type="email" id="suUser" placeholder="voce@autosintese.com.br"></div>
      <div class="row2">
        <div class="field"><label>Senha</label><input type="password" id="suPw" placeholder="mínimo 6 caracteres"></div>
        <div class="field"><label>Confirmar</label><input type="password" id="suPw2" placeholder="repita"></div>
      </div>
      <button class="btn" id="btnSignup">Criar conta</button>
      <div class="err" id="suErr"></div>
      <p class="hint" style="text-align:center"><a href="#" id="goLogin" class="link">← Voltar para o login</a></p>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">

/* ======================= CRIPTOGRAFIA ======================= */
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = { to:a=>btoa(String.fromCharCode(...new Uint8Array(a))),
  from:s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)) };

async function deriveKey(pw, salt){
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptData(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return b64.to(iv)+':'+b64.to(ct);
}
async function decryptData(key, blob){
  const [ivs, cts] = blob.split(':');
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64.from(ivs)}, key, b64.from(cts));
  return JSON.parse(dec.decode(pt));
}

function blankDB(){ return normalizeDB({}); }

/* Dados da empresa: uma linha por módulo na tabela `itens` (jsonb) */
const MODMAP=[['financeiro','financeiro'],['senhas','senhas'],['links','links'],['projetos','projetos'],['folha_fixos','folhaFixos'],['folha','folha'],['clientes','clientes'],['recebimentos','recebimentos'],['trafego','trafego'],['contas_meta','contasMeta']];
async function loadDB(){
  const {data,error}=await sb.from('itens').select('modulo,dados');
  if(error) throw error;
  const map={}; (data||[]).forEach(r=>map[r.modulo]=r.dados);
  DB=normalizeDB({financeiro:map.financeiro,senhas:map.senhas,links:map.links,projetos:map.projetos,folhaFixos:map.folha_fixos,folha:map.folha,clientes:map.clientes,recebimentos:map.recebimentos,trafego:map.trafego,contasMeta:map.contas_meta});
  /* autocura: todo cliente sempre tem um projeto */
  DB.clientes.forEach(c=>{ if(!DB.projetos.some(p=>p.clienteId===c.id)) DB.projetos.push({id:'prj_'+c.id,clienteId:c.id,nome:c.nome,responsavel:'',status:'novo',prazo:'',notas:(c.servico||'')+(c.nicho?(' · '+c.nicho):'')}); });
  await loadSenhasPriv();
}
async function loadSenhasPriv(){ try{ const {data}=await sb.from('senhas_privadas').select('id,dados'); DB.senhasPriv=(data||[]).map(r=>({...(r.dados||{}),id:r.id,__priv:true})); }catch(_){ DB.senhasPriv=[]; } }
async function saveDB(){
  if(!SESSION){ toast('Sessão expirada — entre de novo.'); throw new Error('sem sessão'); }
  const livres=['projetos','senhas','links','trafego','contas_meta'];
  const mods=(currentUser&&currentUser.role==='master')?MODMAP:MODMAP.filter(([m])=>livres.includes(m));
  const rows=mods.map(([m,k])=>({modulo:m,dados:DB[k]||[],criado_por:SESSION.user.id}));
  const {error}=await sb.from('itens').upsert(rows,{onConflict:'modulo'});
  if(error){ toast('Erro ao salvar: '+error.message); throw error; }
}
async function ensurePerfil(user){
  let {data:p}=await sb.from('perfis').select('*').eq('id',user.id).maybeSingle();
  if(!p){
    const nome=(user.user_metadata&&user.user_metadata.nome)||String(user.email||'').split('@')[0];
    const ins=await sb.from('perfis').insert({id:user.id,nome,role:'membro',aprovado:false}).select().maybeSingle();
    p=ins.data||{id:user.id,nome,role:'membro',aprovado:false};
  }
  return p;
}

async function runPendingImport(){
  if(!PENDING_IMPORT || !cryptoKey || !DB) return;
  try{
    const items=await decryptData(cryptoKey, PENDING_IMPORT);
    const have=new Set(DB.financeiro.map(x=>x.id));
    const add=items.filter(x=>!have.has(x.id));
    if(!add.length) return;
    DB.financeiro.push(...add);
    await saveDB();
    toast(add.length+' lançamentos do cartão Nubank importados para o Financeiro.');
    render(currentView);
  }catch(e){ /* blob de outra instalação: ignora */ }
}
async function ecdhAes(privKey,pubKey){ /* chave AES a partir de ECDH (aprovação de contas) */
  return crypto.subtle.deriveKey({name:'ECDH',public:pubKey}, privKey, {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
}
async function unlockVault(u,pw){ /* devolve a chave bruta do cofre para este usuário+senha (ou lança erro) */
  const k=await deriveKey(pw,b64.from(u.salt));
  if(u.kind==='ec'){
    const privB=b64.from(await decryptData(k,u.encPriv));
    const priv=await crypto.subtle.importKey('pkcs8',privB,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);
    const ephPub=await crypto.subtle.importKey('jwk',u.ephPub,{name:'ECDH',namedCurve:'P-256'},false,[]);
    return b64.from(await decryptData(await ecdhAes(priv,ephPub),u.wrapEc));
  }
  return b64.from(await decryptData(k,u.wrap));
}

/* ======================= LOGIN ======================= */
const $ = s=>document.querySelector(s);
function show(el){el.classList.remove('hidden')} function hide(el){el.classList.add('hidden')}

async function initLoginScreen(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session){ SESSION=session; await enterApp(); return; }
  }catch(e){}
  show($('#loginView')); $('#loginUser').focus();
}

$('#btnLogin').onclick = doLogin;
$('#loginUser').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginPw').focus();});
$('#loginPw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
async function doLogin(){
  const email=$('#loginUser').value.trim(), pw=$('#loginPw').value, e=$('#loginErr'); e.textContent='';
  if(!email||!pw){ e.textContent='Informe email e senha.'; return; }
  const btn=$('#btnLogin'); btn.disabled=true; btn.textContent='Entrando...';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error){
      e.textContent=/confirm/i.test(error.message)?'Confirme seu email antes de entrar (veja sua caixa de entrada).':'Email ou senha incorretos.';
      return;
    }
    SESSION=data.session;
    await enterApp();
  }catch(err){ e.textContent='Falha de conexão. Verifique sua internet.'; }
  finally{ btn.disabled=false; btn.textContent='Entrar'; }
}

async function doSignup(){
  const nome=$('#suNome').value.trim(), email=$('#suUser').value.trim(), p1=$('#suPw').value, p2=$('#suPw2').value, e=$('#suErr'); e.textContent='';
  if(nome.length<2){ e.textContent='Informe seu nome.'; return; }
  if(!/^\S+@\S+\.\S+$/.test(email)){ e.textContent='Informe um email válido.'; return; }
  if(p1.length<6){ e.textContent='Senha muito curta (mínimo 6 caracteres).'; return; }
  if(p1!==p2){ e.textContent='As senhas não coincidem.'; return; }
  const btn=$('#btnSignup'); btn.disabled=true; btn.textContent='Criando...';
  try{
    const {data,error}=await sb.auth.signUp({email,password:p1,options:{data:{nome}}});
    if(error){ e.textContent=/already|registered/i.test(error.message)?'Esse email já tem conta — use "Entrar".':('Não deu: '+error.message); return; }
    if(data.session){
      SESSION=data.session;
      await ensurePerfil(data.session.user);
      hide($('#signupView')); show($('#loginView'));
      $('#loginErr').textContent='Conta criada! Aguardando aprovação de um usuário master.';
    }else{
      hide($('#signupView')); show($('#loginView'));
      $('#loginErr').textContent='Conta criada! Confirme seu email (caixa de entrada) e depois entre — a conta ainda passa pela aprovação de um master.';
    }
    $('#loginUser').value=email; $('#loginPw').value='';
  }catch(err){ e.textContent='Falha de conexão. Verifique sua internet.'; }
  finally{ btn.disabled=false; btn.textContent='Criar conta'; }
}

const contaMarca=(id)=>(DB.contasMeta||[]).find(x=>x.id===id)||null;
/* Saldo: conta habilitada que estava rodando e zerou o gasto ontem/hoje = provavelmente sem saldo */
const isoLocal=(d)=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);};
const isoMais=(n)=>{const d=new Date(); d.setDate(d.getDate()+n); return isoLocal(d);};
function saldoConta(c){
  const dias=c.dias;
  if(!Array.isArray(dias)||!dias.length) return {ok:false};
  const ontem=isoMais(-1);
  let recente=0, antes=0, ult='';
  dias.forEach(x=>{ const v=+x.s||0; if(x.d>=ontem) recente+=v; else antes+=v; if(v>0&&x.d>ult) ult=x.d; });
  const parou=c.status===1 && antes>0 && recente===0;
  let haDias=0;
  if(ult){ haDias=Math.round((new Date(isoMais(0))-new Date(ult))/86400000); }
  return {ok:true, parou, recente, antes, ult, haDias};
}

/* ---------- MARCA DO CLIENTE (logo + paleta por conta de anúncio) ---------- */
function paletaDoLogo(img){
  try{
    const cv=document.createElement('canvas'); cv.width=cv.height=64;
    const cx=cv.getContext('2d'); cx.drawImage(img,0,0,64,64);
    const px=cx.getImageData(0,0,64,64).data, bins={};
    for(let p=0;p<px.length;p+=4){
      if(px[p+3]<140) continue;
      const r=px[p],g=px[p+1],b=px[p+2];
      if((r+g+b)/3>238) continue; /* fundo branco */
      const key=((r>>4)<<8)|((g>>4)<<4)|(b>>4);
      const o=bins[key]||(bins[key]={n:0,r:0,g:0,b:0});
      o.n++; o.r+=r; o.g+=g; o.b+=b;
    }
    const list=Object.values(bins).map(o=>{
      const r=o.r/o.n,g=o.g/o.n,b=o.b/o.n,mx=Math.max(r,g,b),mn=Math.min(r,g,b);
      return {n:o.n,r,g,b,sat:mx-mn,lum:(mx+mn)/2};
    });
    const hex=o=>'#'+[o.r,o.g,o.b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
    const vivas=list.filter(o=>o.sat>36&&o.lum>30&&o.lum<225).sort((a,b)=>b.n*b.sat-a.n*a.sat);
    const escuras=list.filter(o=>o.lum<90).sort((a,b)=>b.n-a.n);
    return {destaque:vivas[0]?hex(vivas[0]):null, escura:escuras[0]?hex(escuras[0]):null};
  }catch(_){ return {destaque:null,escura:null}; }
}

          const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(img.width*k)); cv.height=Math.max(1,Math.round(img.height*k));
          cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);

};

async function montarRelatorio(accId,cfg){
  const H={headers:{authorization:'Bearer '+SESSION.access_token}};
  const qs=`?since=${cfg.de}&until=${cfg.ate}`;
  const [ri,rc,ra]=await Promise.all([
    fetch(`${META_URL}/insights/${accId}${qs}`,H).then(r=>r.json()),
    fetch(`${META_URL}/campanhas/${accId}${qs}`,H).then(r=>r.json()),
    fetch(`${META_URL}/anuncios/${accId}${qs}`,H).then(r=>r.json())
  ]);
  if(!ri.ok) throw new Error(ri.erro||'falha nos insights');
  if(!rc.ok) throw new Error(rc.erro||'falha nas campanhas');
  const anunciosOk=ra&&ra.ok;
  const acc=(window.__mtDados||[]).find(x=>x.id===accId)||{nome:accId};
  const m=contaMarca(accId)||{};
  const cliente=(m.nome||acc.nome||'').trim();
  const ink=m.cor1||'#14100b', gold=m.cor2||'#b08d3e', paper=m.fundo||'#f5f0e8';
  const ins=(ri.dados&&ri.dados[0])||{};
  const G=+(ins.spend||0), IMP=+(ins.impressions||0), RCH=+(ins.reach||0), CLK=+(ins.clicks||0);
  const Lconta=somaAct(ins,MT_LEADS), VIS=somaAct(ins,MT_VISITAS);
  /* campanhas do período */
  const camps=(rc.campanhas||[]).map(c=>{
    const i=(c.insights&&c.insights.data&&c.insights.data[0])||{};
    return {nome:c.name||'—',obj:c.objective||'',ativa:c.effective_status==='ACTIVE',
      gasto:+(i.spend||0),imp:+(i.impressions||0),clk:+(i.clicks||0),
      leads:somaAct(i,MT_LEADS),vis:somaAct(i,MT_VISITAS)};
  }).filter(c=>c.gasto>0);
  const gLeads=camps.filter(c=>c.leads>0||(!ALCANCE_OBJ.includes(c.obj))).sort((a,b)=>{
    const ca=a.leads?a.gasto/a.leads:1e12, cb=b.leads?b.gasto/b.leads:1e12;
    return ca-cb||b.gasto-a.gasto;

  const gAlc=camps.filter(c=>!gLeads.includes(c));
  const invLeads=gLeads.reduce((s,c)=>s+c.gasto,0), invAlc=gAlc.reduce((s,c)=>s+c.gasto,0);
  const visAlc=gAlc.reduce((s,c)=>s+c.vis,0)||VIS;
  /* Leads do relatório: soma auditável das campanhas (bate com a tabela); cai p/ o total da conta se não houver campanhas */
  const Lcamp=gLeads.reduce((s,c)=>s+c.leads,0);
  const Ltot=Lcamp||Lconta;
  const custoLead=Ltot?(invLeads>0?invLeads:G)/Ltot:0;
  const melhorCPL=gLeads.length&&gLeads[0].leads?gLeads[0].gasto/gLeads[0].leads:0;
  /* anúncios em veiculação */
  const ads=anunciosOk?(ra.anuncios||[]).map(a=>{

    return {nome:a.name||'—',ativo:a.effective_status==='ACTIVE',
      camp:(a.campaign&&a.campaign.name)||'—',conj:(a.adset&&a.adset.name)||'—',
      thumb:(a.creative&&a.creative.thumbnail_url)||'',
      gasto:+(i.spend||0),imp:+(i.impressions||0),clk:+(i.clicks||0),leads:somaAct(i,MT_LEADS)};
  }).filter(a=>a.ativo||a.gasto>0).sort((a,b)=>(b.ativo-a.ativo)||(b.gasto-a.gasto)):[];

    if(!c.leads) return {t:'SEM LEADS',cor:'#c0492f',bg:'#f3ded8'};

    (gLeads.length?` Foram <strong>${brl(invLeads)}</strong> investidos em geração de leads${invAlc?` e <strong>${brl(invAlc)}</strong> em alcance`:''}. O principal destaque foi <strong>${esc(chipNome(gLeads[0].nome))}</strong> (${gLeads[0].leads?'maior eficiência e menor custo por lead':'maior investimento'})${gLeads[1]?`, seguido por <strong>${esc(chipNome(gLeads[1].nome))}</strong>`:''}.`:'');

  const stat=(k,v)=>`<div class="st"><div class="sk">${k}</div><div class="sv">${v}</div></div>`;
  const card4=Ltot?[stat('INVESTIMENTO TOTAL',brl(G)),stat('LEADS GERADOS',String(Ltot)),stat('CUSTO MÉDIO / LEAD',brl(custoLead)),stat(visAlc?'VISITAS AO PERFIL':'ALCANCE',visAlc?nbr(visAlc):nbr(RCH||IMP))]

  /* HTML do relatório */

</style></head><body>

    ${gLeads.map((c,ix)=>{const b=badge(ix,c);const cpl=c.leads?c.gasto/c.leads:0;const wd=cpl&&melhorCPL?Math.max(8,Math.round(melhorCPL/cpl*100)):0;return `<tr>
      <td><span class="rn">${esc(chipNome(c.nome))}</span><span class="rb" style="background:${b.bg};color:${b.cor}">${b.t}</span></td>
      <td class="r big">${c.leads}</td>

    ${stat('INVESTIDO',brl(invAlc))}

</div>`:''}

<div class="page pb">
  <div class="sec">Considerações finais e próximos passos</div>

  <p class="body" contenteditable="true"><strong>Plano de ação para o próximo ciclo:</strong> ${[
    gLeads.length?`(1) manter em produção os anúncios de ${gLeads.slice(0,2).map(c=>esc(chipNome(c.nome))).join(' e ')}, que apresentaram os melhores resultados`:'',

    gAlc.length?`(${piorRuim?3:2}) manter a campanha de alcance ativa, dado o ${visAlc?'baixo custo por visita e o ':''}ganho de reconhecimento local`:''
  ].filter(Boolean).join('; ')}.</p>
  <div class="foot"><span>${esc(cliente.toUpperCase())} — RELATÓRIO DE MÍDIA PAGA</span><span>${MESES[new Date().getMonth()]}/${eAno} · CONFIDENCIAL</span></div>
</div>
</body></html>`;
  return {titulo:cliente+' · '+d2br(cfg.de)+' → '+d2br(cfg.ate), html,

/* Editor do relatório (estilo Reportei): prévia ao vivo, textos editáveis, anúncios com liga/desliga */
/* Tudo que vira editável no relatório ao abrir o editor */
const ED_SEL='h1,.csub,.chip,.cmeta,.prow .pl,.prow .pv,.sec,.shl h2,.shs,.sk,.sv,.fin .fr span,'+
  'table.cons th,table.cons td,.rank .rn,.ft,.fx,.frv .n,.frv .l,.ad .an,.ad .ac,.ad .amk,.ad .amv,'+
  '.ad .tag,p.body,.obs,.foot span';
function abrirEditorRelatorio(rel){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:2000;background:#0d0b14;display:flex;flex-direction:column';
  ov.innerHTML=`
   <div style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)">
     <div style="font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📄 ${esc(rel.titulo)}</div>
     <span style="color:var(--muted);font-size:12px">✏️ clique em qualquer texto do relatório para editar</span>
     <button class="btn small" id="edPdf">🖨 Baixar PDF</button>
     <button class="btn secondary small" id="edClose">Fechar</button>
   </div>
   <div style="flex:1;display:flex;min-height:0">
     <div style="width:290px;flex:none;overflow:auto;border-right:1px solid var(--border);background:var(--panel);padding:14px">
       <div style="font-weight:800;font-size:13px;margin-bottom:4px">Anúncios no relatório</div>
       <div class="hint" style="margin:0 0 10px">Desmarque para ocultar do relatório — atualiza na hora. Os totais das outras páginas continuam considerando todos os anúncios; ajuste os textos manualmente se precisar.</div>
       ${rel.adsErro?`<div class="hint" style="margin:0 0 10px;color:#fbbf24">⚠️ Não foi possível carregar os anúncios do Meta (${esc(rel.adsErro)}). O relatório saiu sem a página de anúncios.</div>`:''}
       <div id="edAds"></div>
       <div style="margin-top:12px;display:flex;gap:8px">
         <button class="iconbtn" id="edAll" style="flex:1">Marcar todos</button>
         <button class="iconbtn" id="edNone" style="flex:1">Desmarcar</button>
       </div>
     </div>
     <iframe id="edFrame" style="flex:1;border:0;background:#dcd5c6"></iframe>
   </div>`;
  document.body.appendChild(ov);
  const ifr=ov.querySelector('#edFrame');
  const lista=ov.querySelector('#edAds');
  const legenda='Todos os anúncios do período · '+rel.ads.filter(a=>a.ativo).length+' ativo'+(rel.ads.filter(a=>a.ativo).length===1?'':'s');
  lista.innerHTML=rel.ads.map((a,i)=>`
    <label style="display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer">
      <input type="checkbox" checked data-adix="${i}" style="margin-top:2px;accent-color:var(--brand2)">
      <span style="font-size:12px;line-height:1.35"><strong>${esc(a.nome)}</strong><br><span style="color:var(--muted)">${esc(a.camp)} · ${a.ativo?'ativo':'pausado'}${a.gasto?' · '+brl(a.gasto):''}</span></span>
    </label>`).join('')||'<div class="hint">Nenhum anúncio no período.</div>';
  const aplicarAds=()=>{
    const doc=ifr.contentDocument; if(!doc) return;
    const cbs=[...lista.querySelectorAll('input[type=checkbox]')];
    cbs.forEach(cb=>{ const el=doc.querySelector('[data-adix="'+cb.dataset.adix+'"]'); if(el) el.style.display=cb.checked?'':'none'; });
    const vis=cbs.filter(x=>x.checked).length;
    const c=doc.getElementById('adsCount'); if(c) c.textContent=vis===rel.ads.length?legenda:(vis+' de '+rel.ads.length+' anúncios exibidos');
    const pg=doc.getElementById('adsPage'); if(pg) pg.style.display=vis?'':'none';
  };
  lista.querySelectorAll('input[type=checkbox]').forEach(cb=>{ cb.onchange=aplicarAds; });
  ifr.onload=()=>{
    const doc=ifr.contentDocument; if(!doc) return;
    doc.querySelectorAll(ED_SEL).forEach(el=>el.setAttribute('contenteditable','true'));
    aplicarAds();
  };
  ifr.srcdoc=rel.html;
  ov.querySelector('#edAll').onclick=()=>{ lista.querySelectorAll('input').forEach(c=>c.checked=true); aplicarAds(); };
  ov.querySelector('#edNone').onclick=()=>{ lista.querySelectorAll('input').forEach(c=>c.checked=false); aplicarAds(); };
  ov.querySelector('#edClose').onclick=()=>{ if(confirm('Fechar o editor? As edições feitas no relatório serão perdidas.')) ov.remove(); };
  ov.querySelector('#edPdf').onclick=()=>{
    const doc=ifr.contentDocument;
    if(!doc){ toast('O relatório ainda está carregando.'); return; }
    /* imprime numa janela própria: preserva as edições e evita o bug de print() em iframe (Safari) */
    const clone=doc.documentElement.cloneNode(true);
    clone.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
    clone.querySelectorAll('[data-adix]').forEach(el=>{ if(el.style.display==='none') el.remove(); });
    const t=clone.querySelector('title'); if(t) t.textContent=rel.arquivo||rel.titulo;
    const w=window.open('','_blank');
    if(!w){ try{ ifr.contentWindow.focus(); ifr.contentWindow.print(); }catch(e){ toast('Habilite pop-ups para baixar o PDF.'); } return; }
    w.document.open(); w.document.write('<!DOCTYPE html><html>'+clone.innerHTML+'</html>'); w.document.close();
    const go=()=>{ try{ w.focus(); w.print(); }catch(e){} };
    if(w.document.readyState==='complete') setTimeout(go,350); else w.onload=()=>setTimeout(go,350);
    toast('Na janela que abriu: escolha "Salvar como PDF".');
  };

/* ---------- PAINEL ---------- */
let dashComp=compNow();
let dashDe=''; let dashAte='';
function renderDash(c){
  if(!currentUser||currentUser.role!=='master'){
    c.innerHTML=`
   <div class="page-head"><div><h2>Painel</h2><div class="desc">Visão geral</div></div></div>
   <div class="cards">
     <div class="card"><div class="k">Projetos ativos</div><div class="v">${DB.projetos.filter(p=>PRJ_NORM(p.status)==='ativo').length}</div></div>
     <div class="card"><div class="k">Total de projetos</div><div class="v">${DB.projetos.length}</div></div>
     <div class="card"><div class="k">Senhas guardadas</div><div class="v">${DB.senhas.length+(DB.senhasPriv||[]).length}</div></div>
     <div class="card"><div class="k">Links</div><div class="v">${DB.links.length}</div></div>
   </div>
   <p class="hint" style="margin-top:12px">Informações financeiras são visíveis apenas para usuários master.</p>`;
    return;
  }
  const range=!!(dashDe&&dashAte);
  const compRef=range?dashDe.slice(0,7):dashComp;
  const RC=calcRecebimentos(compRef);
  const RS={trafego:0,ia:0,full:0,outro:0}, RSn={trafego:0,ia:0,full:0,outro:0};
  DB.clientes.filter(x=>(!x.inicio||compRef>=x.inicio)&&(!x.fim||compRef<=x.fim)).forEach(x=>{
    const pj=DB.projetos.find(p=>p.clienteId===x.id);
    const s=(x.servico||'').toLowerCase(); const tT=/tr[aá]fego/.test(s), tA=/agent/.test(s);
    const k=(pj&&pj.categoria&&CAT_LABEL[pj.categoria])?pj.categoria:(tT&&tA?'full':tA?'ia':tT?'trafego':'outro');
    RS[k]+=(Number(x.valor)||0); RSn[k]++;
  });
  const fin=DB.financeiro.filter(x=>{const d=x.data||''; return range?(d>=dashDe&&d<=dashAte):(d.slice(0,7)===dashComp);});
  const rec=fin.filter(x=>x.tipo==='receita').reduce((s,x)=>s+Number(x.valor),0);
  const desp=fin.filter(x=>x.tipo==='despesa').reduce((s,x)=>s+Number(x.valor),0);
  const saldo=rec-desp;
  const projAtivos=DB.projetos.filter(p=>PRJ_NORM(p.status)==='ativo').length;
  c.innerHTML=`
   <div class="page-head"><div><h2>Painel</h2><div class="desc">${range?('Período: '+fmtDate(dashDe)+' até '+fmtDate(dashAte)):('Visão geral de '+fmtCompExt(dashComp))}</div></div>
     <div class="toolbar">
       <input type="month" class="search" id="dashCompInp" value="${dashComp}" style="min-width:150px" title="Mês">
       <div style="position:relative;display:inline-flex;align-items:center;gap:4px">
         <button class="btn secondary small" onclick="calAbrir('dash')">${range?('📅 '+fmtDate(dashDe).slice(0,5)+' – '+fmtDate(dashAte).slice(0,5)):'📅 Período'}</button>
         ${range?'<button class="iconbtn" onclick="calLimpar(\'dash\')" title="Limpar período">✕</button>':''}
         <div id="calPop" class="calpop hidden"></div>
       </div>
     </div></div>
   <div class="cards">
     <div class="card"><div class="k">Saldo</div><div class="v ${saldo>=0?'pos':'neg'}">${brl(saldo)}</div></div>
     <div class="card"><div class="k">Receitas</div><div class="v pos">${brl(rec)}</div></div>
     <div class="card"><div class="k">Despesas</div><div class="v neg">${brl(desp)}</div></div>
     <div class="card"><div class="k">Projetos ativos</div><div class="v">${projAtivos}</div></div>
   </div>
   <div class="cards">
     <div class="card"><div class="k">Folha pendente</div><div class="v ${DB.folha.filter(p=>range?((p.venc||'')>=dashDe&&(p.venc||'')<=dashAte&&!p.pago):(p.comp===dashComp&&!p.pago)).length?'neg':''}">${brl(DB.folha.filter(p=>range?((p.venc||'')>=dashDe&&(p.venc||'')<=dashAte&&!p.pago):(p.comp===dashComp&&!p.pago)).reduce((s,p)=>s+Number(p.valor),0))}</div></div>
     <div class="card"><div class="k">Total de projetos</div><div class="v">${DB.projetos.length}</div></div>
     <div class="card"><div class="k">Lançamentos</div><div class="v">${fin.length}</div></div>
   </div>
   <h2 style="font-size:16px;margin:4px 0 10px">Clientes — ${fmtCompExt(compRef)}</h2>
   <div class="cards">
     <div class="card"><div class="k">🟢 Recebido</div><div class="v pos">${brl(RC.soma(RC.g.recebido)+RC.sinaisPagos)}</div><div class="sub">${RC.g.recebido.length} cliente${RC.g.recebido.length===1?'':'s'}</div></div>
     <div class="card"><div class="k">🔴 Inadimplentes</div><div class="v ${RC.g.inadimplente.length?'neg':''}">${brl(RC.soma(RC.g.inadimplente))}</div><div class="sub">${RC.g.inadimplente.length} cliente${RC.g.inadimplente.length===1?'':'s'} em atraso</div></div>
     <div class="card"><div class="k">🟡 A receber</div><div class="v">${brl(RC.soma(RC.g.areceber)+RC.sinaisRestante)}</div><div class="sub">${RC.g.areceber.length} cliente${RC.g.areceber.length===1?'':'s'} no prazo</div></div>
     <div class="card"><div class="k">Carteira</div><div class="v">${brl(DB.clientes.filter(x=>(!x.inicio||compRef>=x.inicio)&&(!x.fim||compRef<=x.fim)).reduce((s,x)=>s+(Number(x.valor)||0),0))}</div></div>
   </div>
   <h2 style="font-size:16px;margin:4px 0 10px">Receita por serviço — ${fmtCompExt(compRef)}</h2>
   <div class="cards">
     <div class="card"><div class="k">Tráfego Pago</div><div class="v" style="color:#7db0ff">${brl(RS.trafego)}</div><div class="sub">${RSn.trafego} cliente${RSn.trafego===1?'':'s'}</div></div>
     <div class="card"><div class="k">Agent IA</div><div class="v" style="color:#2dd4bf">${brl(RS.ia)}</div><div class="sub">${RSn.ia} cliente${RSn.ia===1?'':'s'}</div></div>
     <div class="card"><div class="k">Tráfego + Agent IA</div><div class="v" style="color:#fbbf24">${brl(RS.full)}</div><div class="sub">${RSn.full} cliente${RSn.full===1?'':'s'}</div></div>
     ${RSn.outro?`<div class="card"><div class="k">Outros serviços</div><div class="v">${brl(RS.outro)}</div><div class="sub">${RSn.outro} cliente${RSn.outro===1?'':'s'}</div></div>`:''}
   </div>`;
  $('#dashCompInp').onchange=e=>{ dashComp=e.target.value||compNow(); dashDe=''; dashAte=''; render('dash'); };
}
/* ---- calendário de período (roxo) ---- */
let calMes=compNow(); let calSel1=''; let calAlvo='dash';
const calGet=()=>calAlvo==='lanc'?{de:lancDe,ate:lancAte}:{de:dashDe,ate:dashAte};
const calSet=(de,ate)=>{ if(calAlvo==='lanc'){ lancDe=de; lancAte=ate; } else { dashDe=de; dashAte=ate; } };
const calVai=()=>render(calAlvo==='lanc'?'financeiro':'dash');
window.calAbrir=(alvo)=>{ calAlvo=alvo||'dash'; const p=$('#calPop'); if(!p) return;
  if(p.classList.contains('hidden')){ calMes=(calGet().de||'').slice(0,7)||compNow(); calSel1=''; calRender(); p.classList.remove('hidden'); }
  else p.classList.add('hidden'); };
window.calLimpar=(alvo)=>{ if(alvo) calAlvo=alvo; calSet('',''); calSel1=''; calVai(); };
window.calNav=(d)=>{ const [y,m]=calMes.split('-').map(Number); const nd=new Date(y,m-1+d,1);
  calMes=nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0'); calRender(); };
window.calClique=(iso)=>{
  if(!calSel1){ calSel1=iso; calSet('',''); calRender(); return; }
  let a=calSel1,b=iso; if(b<a){ const t=a;a=b;b=t; }
  calSel1=''; calSet(a,b); calVai();
};
window.calRender=()=>{
  const p=$('#calPop'); if(!p) return;
  const [y,m]=calMes.split('-').map(Number);
  const off=new Date(y,m-1,1).getDay(); const last=new Date(y,m,0).getDate();
  const nomes=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  let dias='';
  for(let i=0;i<off;i++) dias+='<span class="dia off"></span>';
  for(let d=1;d<=last;d++){
    const iso=calMes+'-'+String(d).padStart(2,'0');
    let cls='dia';
    const cg=calGet();
    if(calSel1&&iso===calSel1) cls+=' sel';
    else if(!calSel1&&cg.de&&cg.ate){ if(iso===cg.de||iso===cg.ate) cls+=' sel'; else if(iso>cg.de&&iso<cg.ate) cls+=' faixa'; }
    dias+=`<button class="${cls}" onclick="calClique('${iso}')">${d}</button>`;
  }
  p.innerHTML=`
   <div class="chead"><button class="cnav" onclick="calNav(-1)">‹</button><b>${nomes[m-1]} ${y}</b><button class="cnav" onclick="calNav(1)">›</button></div>

const ST_LABEL={novo:'Cliente novo',onboarding:'Onboarding',ativo:'Cliente ativo',churn:'Aviso de churn'};

const CAT_LABEL={trafego:'Tráfego Pago',ia:'Agent IA',full:'Tráfego + Agent IA',outro:'Outro'};
const FOTOS={};
const avtCor=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return ['#7c3aed','#2563eb','#0d9488','#d97706','#dc2626','#db2777','#059669','#4f46e5'][h%8]};
const avt=(n,papel)=>{ if(!n)return ''; const f=FOTOS[n.trim().toLowerCase()];
  if(f) return `<span class="avt" style="background-image:url(${f});background-size:cover;background-position:center" title="${papel}: ${esc(n)}"></span>`;
  return `<span class="avt" style="background:${avtCor(n)}" title="${papel}: ${esc(n)}">${esc(n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase())}</span>`; };

const NICHOS=['Loja de Carro','Loja de Moto','Odontologia','Diversos'];
const nichoDe=(p,c)=>{ if(p.nicho&&NICHOS.includes(p.nicho)) return p.nicho;
  const s=((p.nicho||'')+' '+((c&&c.nicho)||'')).toLowerCase();
  if(/moto/.test(s)) return 'Loja de Moto';
  if(/carro|ve[ií]culo|autom[óo]ve|seminovo|multimarca/.test(s)) return 'Loja de Carro';
  if(/odonto|dent/.test(s)) return 'Odontologia';
  if(s.trim()) return 'Diversos';
  return ''; };

const catDe=(p)=>{ if(p.categoria&&CAT_LABEL[p.categoria]) return p.categoria;

let cliComp = compNow();
let diaFiltro='';
let statusFiltro='';
function calcRecebimentos(comp){
  const hoje=new Date().toISOString().slice(0,10);
  const byCli={}; DB.recebimentos.filter(r=>r.comp===comp).forEach(r=>{byCli[r.clienteId]=r;});
  const st=(c)=>{ const r=byCli[c.id];
    if(r) return r.status||(r.recebido?'recebido':((r.venc&&r.venc<hoje)?'inadimplente':'areceber'));
    if(!(c.diaVenc>=1&&c.diaVenc<=31)) return null;
    if(c.inicio && comp<c.inicio) return null; /* cliente só conta a partir do mês de início */
    if(c.fim && comp>c.fim) return null; /* churn: depois do último mês o cliente zera */
    if(comp<'2026-07') return null; /* início do sistema: antes de jul/2026 fica zerado */
    if(comp>compNow()) return 'areceber';
    return vencOf(comp,c.diaVenc)<hoje?'inadimplente':'areceber'; };
  const g={recebido:[],sinal:[],inadimplente:[],areceber:[],semdia:[]};
  DB.clientes.forEach(c=>{ const s=st(c); if(!s){g.semdia.push(c);} else {g[s].push(c);} });
  const val=(c)=>{ const r=byCli[c.id]; return Number((r&&r.valor!=null)?r.valor:c.valor)||0; }; /* valor congelado do mês, se houver registro */
  const soma=a=>a.reduce((s,x)=>s+val(x),0);
  const sinaisPagos=g.sinal.reduce((s,c)=>s+(Number((byCli[c.id]||{}).sinal)||0),0);
  const sinaisRestante=g.sinal.reduce((s,c)=>s+Math.max(0,val(c)-(Number((byCli[c.id]||{}).sinal)||0)),0);
  return {byCli, st, g, soma, val, sinaisPagos, sinaisRestante};
}

window.rcStatusCli=async (cliId,novo)=>{
  if(!novo)return;
  const comp=cliComp; const c=DB.clientes.find(x=>x.id===cliId); if(!c)return;
  let r=DB.recebimentos.find(x=>x.comp===comp&&x.clienteId===cliId);
  if(!r){
    if(!(c.diaVenc>=1&&c.diaVenc<=31)){ toast('Defina o dia de vencimento primeiro (Editar).'); return; }
    r={id:uid(),comp,clienteId:c.id,nome:c.nome,resp:c.resp||'',tel:c.tel||'',valor:Number(c.valor)||0,venc:vencOf(comp,c.diaVenc),recebido:false,recebidoEm:null,status:null};
    DB.recebimentos.push(r);
  }
  if(novo==='sinal'){
    const sv=parseFloat((prompt('Valor do sinal recebido (R$):','')||'').replace(',','.'));
    if(!(sv>0)){ toast('Sinal cancelado — valor inválido.'); render('clientes'); return; }
    if(sv>=(Number(r.valor)||0)){ toast('Sinal maior ou igual ao total — use 🟢 Recebido.'); render('clientes'); return; }
    r.status='sinal'; r.sinal=sv; r.sinalEm=new Date().toISOString().slice(0,10);
    r.recebido=false; r.recebidoEm=null;
    DB.financeiro=DB.financeiro.filter(x=>x.id!=='rc_'+r.id&&x.id!=='rcs_'+r.id);
    DB.financeiro.push({id:'rcs_'+r.id,data:r.sinalEm,tipo:'receita',descricao:'Sinal: '+r.nome,categoria:'Mensalidade Clientes',valor:sv});
  } else if(novo==='recebido'){
    r.status='recebido';
    if(!r.recebido){ r.recebido=true; r.recebidoEm=new Date().toISOString().slice(0,10);
      const restante=Math.max(0,(Number(r.valor)||0)-(Number(r.sinal)||0));
      DB.financeiro=DB.financeiro.filter(x=>x.id!=='rc_'+r.id);
      DB.financeiro.push({id:'rc_'+r.id,data:r.recebidoEm,tipo:'receita',descricao:(r.sinal?'Restante: ':'Mensalidade: ')+r.nome,categoria:'Mensalidade Clientes',valor:(r.sinal?restante:(Number(r.valor)||0))}); }
  } else {
    r.status=novo; r.recebido=false; r.recebidoEm=null; r.sinal=null; r.sinalEm=null;
    DB.financeiro=DB.financeiro.filter(x=>x.id!=='rc_'+r.id&&x.id!=='rcs_'+r.id);
  }
  await saveDB(); render('clientes'); toast('Status de '+c.nome+': '+(novo==='recebido'?'🟢 Recebido':novo==='sinal'?'🔵 Sinal pago':novo==='inadimplente'?'🔴 Inadimplente':'🟡 A receber'));
};

window.gerarFolha=async ()=>{
  const comp=folhaComp;
  const ativos=DB.folhaFixos.filter(f=>f.ativo);
  if(!ativos.length){ toast('Cadastre os fixos mensais primeiro.'); return; }
  const doComp=DB.folha.filter(p=>p.comp===comp&&p.fixoId);
  const temMensal=new Set(doComp.map(p=>p.fixoId));
  const temData=new Set(doComp.map(p=>p.fixoId+'|'+p.venc));
  const [y,m]=comp.split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  const dAnt=new Date(y,m-2,1); const mesAnt=dAnt.getFullYear()+'-'+String(dAnt.getMonth()+1).padStart(2,'0');
  let n=0;
  ativos.forEach(f=>{
    if(f.inicioComp && comp<f.inicioComp) return; /* só gera a partir do mês configurado */
    if(f.recorrente===false){ /* pagamento único na data marcada, sem recorrência */
      if(!f.proxData||f.proxData.slice(0,7)!==comp) return;
      if(temData.has(f.id+'|'+f.proxData)||temMensal.has(f.id)) return;
      DB.folha.push({id:uid(),comp,fixoId:f.id,nome:f.nome,descricao:((f.descricao||'')+(f.posPago?((f.descricao?' — ':'')+'ref. '+fmtComp(mesAnt)):'')+' · único').trim(),valor:Number(f.valor)||0,venc:f.proxData,pago:false,pagoEm:null});
      n++; return;
    }
    if(f.freq==='semanal'){
      for(let d=1;d<=last;d++){
        if(new Date(y,m-1,d).getDay()!==(Number(f.diaSemana)||0)) continue;
        const venc=comp+'-'+String(d).padStart(2,'0');
        if(temData.has(f.id+'|'+venc)) continue;
        DB.folha.push({id:uid(),comp,fixoId:f.id,nome:f.nome,descricao:(f.descricao?f.descricao+' — ':'')+'semanal ('+DSEM[Number(f.diaSemana)||0]+')'+(f.posPago?' · pós-pago':''),valor:Number(f.valor)||0,venc,pago:false,pagoEm:null});
        n++;
      }
    } else {
      if(temMensal.has(f.id)) return;
      DB.folha.push({id:uid(),comp,fixoId:f.id,nome:f.nome,descricao:(f.descricao||'')+(f.posPago?((f.descricao?' — ':'')+'ref. '+fmtComp(mesAnt)):''),valor:Number(f.valor)||0,venc:vencOf(comp,f.dia),pago:false,pagoEm:null});
      n++;
    }
  });
  if(!n){ toast('A folha de '+fmtComp(comp)+' já está gerada.'); return; }
  await saveDB(); render('folha'); toast(n+' pagamento(s) gerado(s) para '+fmtComp(comp)+'.');
};

    </div>
    <div class="row2">
      <div class="field"><label>📅 Próximo pagamento (abre o calendário)</label><input type="date" id="m_prox" value="${it.proxData||''}"></div>
      <div class="field" style="display:flex;align-items:flex-end"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin:0 0 8px;font-size:13px;color:var(--txt)"><input type="checkbox" id="m_rec" ${it.recorrente!==false?'checked':''} style="accent-color:#7c3aed;width:16px;height:16px;cursor:pointer"> Repetir daqui em diante</label></div>
    </div>
    <div class="row2">
      <div class="field"><label>Modelo</label><select id="m_pos"><option value="0"${!it.posPago?' selected':''}>Pré-pago — mês vigente</option><option value="1"${it.posPago?' selected':''}>Pós-pago — ref. mês anterior</option></select></div>
      <div class="field"><label>Gerar a partir de (opcional)</label><input type="month" id="m_inicioComp" value="${it.inicioComp||''}"></div>
    </div>
    <div class="field"><label>Ativo (entra na geração do mês)</label><select id="m_ativo"><option value="1"${it.ativo?' selected':''}>Sim</option><option value="0"${!it.ativo?' selected':''}>Não</option></select></div>`,
    async ()=>{
      const v={nome:$('#m_nome').value.trim(),descricao:$('#m_desc').value.trim(),pix:$('#m_pix').value.trim(),banco:$('#m_banco').value.trim(),dp:$('#m_dp').value.trim(),freq:$('#m_freq').value,diaSemana:parseInt($('#m_dsem').value)||0,posPago:$('#m_pos').value==='1',inicioComp:$('#m_inicioComp').value||null,dia:Math.min(31,Math.max(1,parseInt($('#m_dia').value)||1)),valor:parseFloat($('#m_valor').value)||0,ativo:$('#m_ativo').value==='1',proxData:$('#m_prox').value||null,recorrente:$('#m_rec').checked};
      if(v.proxData){ const pd=new Date(v.proxData+'T12:00:00'); v.dia=Math.min(31,Math.max(1,pd.getDate())); v.diaSemana=pd.getDay(); v.inicioComp=v.proxData.slice(0,7); }
      if(!v.nome){ toast('Informe o nome.'); return false; }
      if(id){ Object.assign(it,v); } else { DB.folhaFixos.push({id:uid(),...v}); }
      await saveDB(); render('folha'); toast('Salvo.'); return true;
    });
  $('#m_freq').onchange=()=>{ const s=$('#m_freq').value==='semanal'; $('#wrapDia').style.display=s?'none':''; $('#wrapDsem').style.display=s?'':'none'; };
};
window.copyPixFixo=(id)=>{ const f=DB.folhaFixos.find(x=>x.id===id); if(f&&f.pix) copyTxt(f.pix); };
window.fixoMove=async (id,dir)=>{
  const i=DB.folhaFixos.findIndex(x=>x.id===id); if(i<0)return;
  const j=i+dir; if(j<0||j>=DB.folhaFixos.length)return;
  const t=DB.folhaFixos[i]; DB.folhaFixos[i]=DB.folhaFixos[j]; DB.folhaFixos[j]=t;
  await saveDB(); render('folha');
};
window.fixoExcluir=async (id)=>{
  if(!confirm('Excluir este fixo mensal? (Os pagamentos já gerados permanecem.)'))return;
  DB.folhaFixos=DB.folhaFixos.filter(x=>x.id!==id);
  await saveDB(); render('folha'); toast('Fixo excluído.');
};

/* ---------- USUÁRIOS (perfis no Supabase) ---------- */
let PERFIS=[];
function renderUsuarios(c){
  if(!currentUser || currentUser.role!=='master'){ c.innerHTML='<div class="empty">Acesso restrito a usuários master.</div>'; return; }
  c.innerHTML='<div class="empty">Carregando usuários...</div>';
  sb.from('perfis').select('*').order('criado_em').then(({data,error})=>{
    if(error){ c.innerHTML='<div class="empty">Erro ao carregar: '+esc(error.message)+'</div>'; return; }
    PERFIS=data||[]; drawUsuarios(c);
  });
}
function drawUsuarios(c){
  const ativos=PERFIS.filter(u=>u.aprovado), pend=PERFIS.filter(u=>!u.aprovado);
  c.innerHTML=`
   <div class="page-head">
     <div><h2>Usuários</h2><div class="desc">Contas de acesso ao sistema</div></div>
   </div>
   <div class="tablewrap"><table><thead><tr><th>Nome</th><th>Função</th><th>Criado em</th><th></th></tr></thead>
   <tbody>${ativos.map(u=>`<tr>
     <td><strong>${esc(u.nome)}</strong>${u.id===currentUser.id?' <span class="tag st">você</span>':''}</td>
     <td><span class="tag ${u.role==='master'?'andamento':'st'}">${u.role==='master'?'Master':'Usuário'}</span></td>
     <td>${fmtDate((u.criado_em||'').slice(0,10))||'—'}</td>
     <td><div class="rowact">
       ${u.id!==currentUser.id?`<button class="iconbtn" onclick="toggleRole('${u.id}')">${u.role==='master'?'Tornar usuário':'Tornar master'}</button>
       <button class="iconbtn del" onclick="removeUser('${u.id}')">Revogar acesso</button>`:''}
     </div></td>
   </tr>`).join('')}</tbody></table></div>
   ${pend.length?`
   <h2 style="font-size:16px;margin:24px 0 10px">Solicitações de conta pendentes</h2>
   <div class="tablewrap"><table><thead><tr><th>Nome</th><th>Solicitado em</th><th></th></tr></thead>
   <tbody>${pend.map(p=>`<tr>
     <td><strong>${esc(p.nome)}</strong></td>
     <td>${fmtDate((p.criado_em||'').slice(0,10))||'—'}</td>
     <td><div class="rowact">
       <button class="iconbtn" onclick="approveReq('${p.id}')">Aprovar</button>
       <button class="iconbtn del" onclick="removeUser('${p.id}')">Recusar</button>
     </div></td>
   </tr>`).join('')}</tbody></table></div>`:''}
   <p class="hint" style="margin-top:14px">Cada pessoa cria a própria conta na tela de login ("Criar conta") e um <strong>master</strong> aprova aqui. Todos os aprovados acessam os mesmos dados, de qualquer dispositivo, em autosintese.app.br. Quem esquecer a senha usa "Esqueci a senha" no login. "Revogar acesso" tira a pessoa do sistema na hora.</p>`;
}
window.toggleRole=async (id)=>{
  const u=PERFIS.find(x=>x.id===id); if(!u)return;
  const novo=u.role==='master'?'membro':'master';
  const {error}=await sb.from('perfis').update({role:novo}).eq('id',id);
  if(error){ toast('Erro: '+error.message); return; }
  toast('"'+u.nome+'" agora é '+(novo==='master'?'master':'usuário')+'.'); render('usuarios');
};
window.approveReq=(id)=>{
  const p=PERFIS.find(x=>x.id===id); if(!p)return;
  modal('Aprovar conta — '+esc(p.nome),`
    <p class="hint" style="margin:0 0 14px">A pessoa entra com o email e a senha que ela mesma escolheu.</p>
    <div class="field"><label>Função</label><select id="ap_role">
      <option value="membro">Usuário — acessa o sistema</option>
      <option value="master">Master — acessa e gerencia usuários</option></select></div>`,
    async ()=>{
      const {error}=await sb.from('perfis').update({aprovado:true,role:$('#ap_role').value}).eq('id',id);
      if(error){ toast('Erro: '+error.message); return false; }
      render('usuarios'); toast('Conta de "'+p.nome+'" aprovada.'); return true;
    });
};
window.removeUser=async (id)=>{
  const u=PERFIS.find(x=>x.id===id); if(!u)return;
  if(u.aprovado && u.role==='master' && PERFIS.filter(x=>x.aprovado&&x.role==='master').length<=1){ toast('Não dá para remover o único master.'); return; }
  if(!confirm((u.aprovado?'Revogar o acesso de "':'Recusar a solicitação de "')+u.nome+'"?'))return;
  const {error}=await sb.from('perfis').delete().eq('id',id);
  if(error){ toast('Erro: '+error.message); return; }
  render('usuarios'); toast(u.aprovado?'Acesso revogado.':'Solicitação recusada.');
};

/* ======================= MODAL / AÇÕES ======================= */
function modal(title, bodyHTML, onSave){
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="modal"><div class="mhead"><h3>${title}</h3><button class="x">&times;</button></div>
    <div class="mbody">${bodyHTML}</div>
    <div class="mfoot"><button class="btn secondary small mcancel">Cancelar</button><button class="btn small msave">Salvar</button></div></div>`;
  document.body.appendChild(o);
  const close=()=>o.remove();
  o.querySelector('.x').onclick=close; o.querySelector('.mcancel').onclick=close;
  o.onclick=e=>{if(e.target===o)close();};
  o.querySelector('.msave').onclick=async ()=>{ const ok=await onSave(); if(ok!==false)close(); };
}
window.delItem=async (col,id)=>{ if(!confirm('Excluir este item?'))return;
  DB[col]=DB[col].filter(x=>x.id!==id); await saveDB(); render(currentView); toast('Excluído.'); };
window.copyTxt=(t)=>{ navigator.clipboard.writeText(t).then(()=>toast('Copiado.')); };
window.copyPw=(id)=>{ const r=findSenha(id); if(r) copyTxt(r.senha||''); };
window.copyLogin=(id)=>{ const r=findSenha(id); if(r) copyTxt(r.login||''); };

/* ======================= BACKUP / SENHA ======================= */
$('#btnBackup').onclick=()=>{
  modal('Backup / Restaurar',`
    <p class="hint" style="margin:0 0 14px">Os dados já ficam salvos na nuvem da empresa (Supabase). Use o backup como cópia extra de segurança, ou para importar dados do sistema antigo (arquivo .json da v2).</p>
    <button class="btn small" style="width:100%;margin-bottom:10px" id="doExport">⬇ Exportar backup (.json)</button>
    <div class="field"><label>Restaurar / importar de arquivo</label><input type="file" id="impFile" accept="application/json"></div>
    <p class="hint">⚠️ O backup exportado NÃO é criptografado — contém as senhas do módulo Senhas em texto. Ao restaurar, os dados atuais de TODOS os usuários são substituídos.</p>`,
    async ()=>true);
  setTimeout(()=>{
    $('#doExport').onclick=()=>{
      const blob=new Blob([JSON.stringify({__v:3,...DB},null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='autosintese-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
      toast('Backup exportado.');
    };
    $('#impFile').onchange=(e)=>{
      const f=e.target.files[0]; if(!f)return; const r=new FileReader();
      r.onload=async ()=>{ try{ const d=JSON.parse(r.result);
        if(!confirm('Substituir os dados atuais do sistema pelos do arquivo? Isso vale para todos os usuários.'))return;
        DB=normalizeDB(d);
        await saveDB(); document.querySelector('.overlay').remove(); render(currentView); toast('Dados restaurados na nuvem.');
      }catch(err){toast('Arquivo inválido.');} };
      r.readAsText(f);
    };
  },30);
};
$('#btnChangePw').onclick=()=>{
  modal('Mudar minha senha',`
    <div class="field"><label>Senha atual</label><input type="password" id="cp_old" placeholder="senha atual"></div>
    <div class="field"><label>Nova senha</label><input type="password" id="cp_new" placeholder="mínimo 6 caracteres"></div>
    <div class="field"><label>Confirmar nova senha</label><input type="password" id="cp_new2" placeholder="repita"></div>`,
    async ()=>{
      const old=$('#cp_old').value, n1=$('#cp_new').value, n2=$('#cp_new2').value;
      if(n1.length<6){toast('Nova senha muito curta.');return false;}
      if(n1!==n2){toast('As senhas não coincidem.');return false;}
      const {error:e1}=await sb.auth.signInWithPassword({email:SESSION.user.email,password:old});
      if(e1){ toast('Senha atual incorreta.'); return false; }
      const {error:e2}=await sb.auth.updateUser({password:n1});
      if(e2){ toast('Erro: '+e2.message); return false; }
      toast('Senha alterada.'); return true;
    });
};

/* ======================= START ======================= */
initLoginScreen();
</script>
