<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Enviar boleto ou comprovante · AutoSíntese</title>
<link rel="icon" href="/icones/favicon-64.png">
<meta name="theme-color" content="#141416">
<style>
  :root{
    --bg:#141416; --panel:#1b1b1f; --panel2:#232329; --line:#2c2c34;
    --txt:#ececf1; --muted:#9a9aa6; --fraco:#6e6e7a;
    --brand:#7b68ee; --brand2:#a78bfa; --ok:#22c07a; --danger:#ff6b7a; --aviso:#f0c869;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;padding:28px 18px 60px}
  .wrap{max-width:520px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  header img{height:30px}
  h1{font-size:23px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px}
  .cartao{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
  .campo{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
  label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--txt)}
  label span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--fraco);font-size:12px}
  input,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:11px 13px;font:inherit;font-size:15px;width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--brand)}
  input::placeholder,textarea::placeholder{color:var(--fraco)}
  textarea{resize:vertical;min-height:74px}
  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:420px){.dupla{grid-template-columns:1fr}}
  .solta{position:absolute;left:-9999px;opacity:0;height:0}
  .arq{border:1px dashed var(--line);border-radius:12px;padding:20px 14px;text-align:center;cursor:pointer;
    background:var(--panel2);transition:border-color .15s,background .15s}
  .arq:hover,.arq.sobre{border-color:var(--brand);background:#25212f}
  .arq b{display:block;font-size:14px;margin-bottom:3px}
  .arq small{color:var(--fraco);font-size:12px}
  .arq input{display:none}
  .escolhido{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;font-size:13px}
  .escolhido .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .escolhido button{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
  .btn{width:100%;background:var(--brand);color:#fff;border:0;border-radius:11px;padding:14px;font:inherit;
    font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
  .btn:disabled{opacity:.6;cursor:default}
  .aviso{font-size:12.5px;color:var(--fraco);margin-top:14px;line-height:1.5}
  .erro{background:color-mix(in srgb,var(--danger) 14%,transparent);border:1px solid var(--danger);color:var(--danger);
    border-radius:10px;padding:11px 13px;font-size:13.5px;margin-bottom:15px}
  .pronto{text-align:center;padding:26px 8px}
  .pronto .ic{font-size:44px;line-height:1}
  .pronto h2{font-size:20px;margin:12px 0 6px}
  .pronto p{color:var(--muted);font-size:14px;margin:0 0 20px}
  .link{background:none;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 18px;
    font:inherit;font-size:14px;cursor:pointer}
  footer{text-align:center;color:var(--fraco);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="/ads/assets/logo-horizontal-branca.png" alt="AutoSíntese"></header>

  <div id="tela">
    <h1>Enviar boleto ou comprovante</h1>
    <p class="sub">Preencha os cinco campos e anexe o arquivo. Vai direto para a aprovação da AutoSíntese.</p>

    <div class="cartao">
      <div id="erro" class="erro" style="display:none"></div>
      <form id="f" novalidate>
        <div class="campo">
          <label for="quem">Quem está enviando</label>
          <input id="quem" name="quem" placeholder="Seu nome ou o da empresa" autocomplete="name" maxlength="120" required>
        </div>
        <div class="campo">
          <label for="oque">Do que se trata</label>
          <input id="oque" name="oque" placeholder="Ex.: Boleto da gráfica, aluguel de setembro" maxlength="160" required>
        </div>
        <div class="dupla">
          <div class="campo">
            <label for="valor">Valor <span>(R$)</span></label>
            <input id="valor" name="valor" inputmode="decimal" placeholder="0,00" required>
          </div>
          <div class="campo">
            <label for="venc">Vencimento</label>
            <input id="venc" name="venc" type="date" required>
          </div>
        </div>
        <div class="campo">
          <label>Arquivo <span>· PDF ou foto, até 10 MB</span></label>
          <label class="arq" id="solta" for="arquivo">
            <b>Toque para escolher o arquivo</b>
            <small>boleto, nota fiscal, cupom ou comprovante</small>
            <input id="arquivo" name="arquivo" type="file" accept=".pdf,image/png,image/jpeg,image/webp,image/heic">
          </label>
          <div class="escolhido" id="escolhido" style="display:none">
            <span>📎</span><span class="nm" id="arqNome"></span><span id="arqTam" style="color:var(--fraco)"></span>
            <button type="button" id="tirar" title="Trocar">&times;</button>
          </div>
        </div>
        <div class="campo">
          <label for="obs">Observação <span>· opcional</span></label>
          <textarea id="obs" name="obs" placeholder="Algo que a gente precise saber antes de pagar" maxlength="600"></textarea>
        </div>
        <input class="solta" type="text" name="site" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn" id="btn" type="submit">Enviar para aprovação</button>
      </form>
      <p class="aviso">Nada é pago automaticamente: o pedido fica aguardando a aprovação da AutoSíntese. Se faltar informação no arquivo, alguém entra em contato.</p>
    </div>
  </div>
</div>

<script>
(function(){
  var API='https://fuieonexmdupupcsyowg.supabase.co/functions/v1/enviar-conta';
  var $=function(i){return document.getElementById(i)};
  var arq=null;

  /* valor: aceita 1.234,56 e 1234.56 */
  $('valor').addEventListener('input',function(){ this.value=this.value.replace(/[^\d.,]/g,''); });

  function mostra(f){
    arq=f;
    if(!f){ $('escolhido').style.display='none'; $('solta').style.display='block'; $('arquivo').value=''; return; }
    $('arqNome').textContent=f.name;
    $('arqTam').textContent=(f.size/1048576).toFixed(1)+' MB';
    $('escolhido').style.display='flex'; $('solta').style.display='none';
  }
  $('arquivo').addEventListener('change',function(){ mostra(this.files[0]||null); });
  $('tirar').addEventListener('click',function(){ mostra(null); });

  var z=$('solta');
  ['dragenter','dragover'].forEach(function(e){ z.addEventListener(e,function(ev){ ev.preventDefault(); z.classList.add('sobre'); }); });
  ['dragleave','drop'].forEach(function(e){ z.addEventListener(e,function(ev){ ev.preventDefault(); z.classList.remove('sobre'); }); });
  z.addEventListener('drop',function(ev){ var f=ev.dataTransfer&&ev.dataTransfer.files&&ev.dataTransfer.files[0]; if(f) mostra(f); });

  function erro(t){ var e=$('erro'); e.textContent=t; e.style.display='block'; e.scrollIntoView({block:'center',behavior:'smooth'}); }

  $('f').addEventListener('submit',function(ev){
    ev.preventDefault();
    $('erro').style.display='none';
    var falta=[['quem','Quem está enviando'],['oque','Do que se trata'],['valor','Valor'],['venc','Vencimento']]
      .filter(function(c){ return !String($(c[0]).value||'').trim(); });
    if(falta.length){ erro('Falta preencher: '+falta.map(function(c){return c[1]}).join(', ')+'.'); $(falta[0][0]).focus(); return; }
    if(!arq){ erro('Anexe o boleto ou o comprovante.'); return; }
    if(arq.size>10485760){ erro('O arquivo tem mais de 10 MB. Mande um menor ou tire uma foto com menos qualidade.'); return; }

    var b=$('btn'); b.disabled=true; b.textContent='Enviando…';
    var fd=new FormData($('f'));
    fd.set('arquivo',arq);
    fetch(API,{method:'POST',body:fd})
      .then(function(r){ return r.json().catch(function(){ return {ok:false,motivo:'Resposta inesperada.'}; }); })
      .then(function(j){
        if(!j.ok){ erro(j.motivo||'Não deu para enviar. Tente de novo.'); b.disabled=false; b.textContent='Enviar para aprovação'; return; }
        $('tela').innerHTML='<div class="cartao pronto"><div class="ic">✅</div>'+
          '<h2>Recebemos</h2><p>Seu envio está na fila de aprovação da AutoSíntese.<br>Não precisa mandar de novo.</p>'+
          '<button class="link" id="outro">Enviar outro</button></div>';
        $('outro').addEventListener('click',function(){ location.reload(); });
        window.scrollTo({top:0,behavior:'smooth'});
      })
      .catch(function(){ erro('Sem conexão. Tente de novo em instantes.'); b.disabled=false; b.textContent='Enviar para aprovação'; });
  });
})();
</script>
</body>
</html>
